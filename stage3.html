<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Этап 3 — Сборщик</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stage.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">← На главную</a>
    <article class="stage-page">
      <h1>Этап 3. Сборщик</h1>
      <h2 class="task-title" id="task-title">Загрузка…</h2>
      <p class="lead" id="task-description"></p>
      <p class="builder-help">Перетаскивайте нужные блоки в «Программу» или добавляйте их кнопкой. Лишние блоки оставьте в «Блоках».</p>

      <div class="builder-zones">
        <section class="builder-zone">
          <h3 class="builder-zone-title">Блоки</h3>
          <ul id="block-pool" class="sortable-list"></ul>
        </section>
        <section class="builder-zone">
          <h3 class="builder-zone-title">Программа</h3>
          <ol id="block-program" class="sortable-list program-list"></ol>
        </section>
      </div>

      <div class="builder-actions">
        <button type="button" class="btn" id="check-order">Проверить</button>
        <button type="button" class="btn btn-secondary" id="reset-order">Сброс</button>
        <button type="button" class="btn" id="next-task" hidden>Следующая задача</button>
      </div>

      <p id="builder-message" class="builder-message" hidden></p>
    </article>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/stage3.js"></script>
</body>
</html>
