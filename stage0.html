<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Этап 0 — Обозначения</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stage.css">
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">← На главную</a>
    <article class="stage-page">
      <h1>Этап 0. Обозначения</h1>
      <p class="lead">Пять модулей. Следующий открывается после прохождения предыдущего (не менее 80%).</p>
      <div class="skip-actions">
        <button type="button" class="btn" id="open-placement">Я знаю базу (Пропустить этап)</button>
      </div>
      <section class="quiz-progress progress-panel" aria-label="Прогресс модулей">
        <div class="progress-meta">
          <span id="module-label">Модуль 1 из 5</span>
          <span id="answered-percent">0%</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="answered-bar">
          <div class="progress-bar-fill" id="answered-bar-fill" style="width:0%"></div>
        </div>
      </section>
      <h2 class="anim-heading" id="module-title">Загрузка…</h2>
      <div id="questions" class="questions"></div>
      <div id="module-actions" class="quiz-actions"></div>
      <p id="module-status" class="quiz-status" hidden></p>
    </article>
  </main>
  <div class="modal-overlay" id="placement-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="placement-title">
      <div class="modal-head">
        <h2 class="modal-title" id="placement-title">Проверка базы</h2>
        <button type="button" class="modal-close" id="close-placement" aria-label="Закрыть">×</button>
      </div>
      <p class="modal-intro">Ответьте на 10 вопросов. Чтобы пропустить этап, нужно не менее 90% правильных ответов.</p>
      <div class="questions" id="placement-questions"></div>
      <div class="quiz-actions" id="placement-actions">
        <button type="button" class="btn" id="check-placement">Проверить</button>
      </div>
      <p class="quiz-status" id="placement-status" hidden></p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/stage0.js"></script>
</body>
</html>
